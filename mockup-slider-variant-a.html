<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider Variant A — Value at End of Track</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1b1b1b;
    --surface-2: #232323;
    --text: #fafafa;
    --border: #FFFFFF1A;
    --muted: #a0a0a0;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --track: #FFFFFF1A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px 16px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .row {
    padding: 10px 0 12px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }

  /* ── Label row: icon + label + hint icon ── */
  .label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 20px; height: 20px; }

  .label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }

  .hint-icon {
    width: 16px;
    height: 16px;
    color: var(--muted);
    cursor: help;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }
  .hint-icon:hover { color: var(--accent-hover); }
  .hint-icon svg { width: 16px; height: 16px; }

  /* ── Slider row: bar + value at end ── */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 auto;
    height: 20px;
    background: transparent;
    cursor: pointer;
    display: block;
  }

  /* track */
  .slider::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--accent) 0%,
      var(--accent) var(--fill, 50%),
      var(--track) var(--fill, 50%),
      var(--track) 100%);
  }
  .slider::-moz-range-track {
    height: 5px;
    border-radius: 999px;
    background: var(--track);
  }
  .slider::-moz-range-progress {
    height: 5px;
    border-radius: 999px;
    background: var(--accent);
  }

  /* thumb */
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    margin-top: -6.5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 0 0 0 rgba(59,130,246,0);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
  }
  .slider:hover::-webkit-slider-thumb {
    transform: scale(1.18);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 6px rgba(59,130,246,0.12);
  }
  .slider:hover::-moz-range-thumb { transform: scale(1.18); }
  .slider:active::-webkit-slider-thumb {
    transform: scale(1.28);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 8px rgba(59,130,246,0.18);
  }
  .slider:focus { outline: none; }
  .slider:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 4px rgba(59,130,246,0.35);
  }

  /* ── Value at end of track ── */
  .value {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex: 0 0 auto;
    min-width: 36px;
    text-align: right;
  }

  @media (prefers-reduced-motion: reduce) {
    .slider::-webkit-slider-thumb,
    .slider::-moz-range-thumb { transition: none; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title">Scan Settings</div>

    <!-- Row 1: Scan height -->
    <div class="row">
      <div class="label-row">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m8 18 4 4 4-4"/><path d="m8 6 4-4 4 4"/></svg>
        </span>
        <span class="label">Scan height</span>
        <span class="hint-icon" title="Bottom % of the video frame">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
      </div>
      <div class="slider-row">
        <input class="slider" type="range" min="0" max="100" value="25" style="--fill: 25%">
        <span class="value">25%</span>
      </div>
    </div>

    <!-- Row 2: Scan width -->
    <div class="row">
      <div class="label-row">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/><path d="m18 8 4 4-4 4"/></svg>
        </span>
        <span class="label">Scan width</span>
        <span class="hint-icon" title="Centered % of the video width">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
      </div>
      <div class="slider-row">
        <input class="slider" type="range" min="0" max="100" value="100" style="--fill: 100%">
        <span class="value">100%</span>
      </div>
    </div>

    <!-- Row 3: Position X -->
    <div class="row">
      <div class="label-row">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/><path d="m18 8 4 4-4 4"/></svg>
        </span>
        <span class="label">Position X</span>
        <span class="hint-icon" title="Horizontal offset from left edge">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
      </div>
      <div class="slider-row">
        <input class="slider" type="range" min="0" max="100" value="50" style="--fill: 50%">
        <span class="value">50%</span>
      </div>
    </div>

    <!-- Row 4: Position Y -->
    <div class="row">
      <div class="label-row">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m8 18 4 4 4-4"/><path d="m8 6 4-4 4 4"/></svg>
        </span>
        <span class="label">Position Y</span>
        <span class="hint-icon" title="Vertical offset from top edge">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
      </div>
      <div class="slider-row">
        <input class="slider" type="range" min="0" max="100" value="70" style="--fill: 70%">
        <span class="value">70%</span>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.slider').forEach(function (s) {
      var valEl = s.closest('.slider-row').querySelector('.value');
      function update() {
        s.style.setProperty('--fill', s.value + '%');
        valEl.textContent = s.value + '%';
      }
      s.addEventListener('input', update);
    });
  </script>
</body>
</html>
