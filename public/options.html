<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cell TTS Verify</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
    body { max-width: 640px; margin: 0 auto; }
    button { padding: 12px 20px; margin-right: 12px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-weight: 600; margin: 16px 0; }
    #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 120px; }
  </style>
</head>
<body>
  <h1>Cell TTS Verify</h1>
  <p id="status">Ready</p>
  <button id="downloadBtn">Tải English</button>
  <button id="speakBtn" disabled>Phát "hello"</button>
  <pre id="log"></pre>
  <script src="options.js" type="module"></script>
</body>
</html>
