<!-- Nav pause — outline circle + two filled rounded bars. Used by navCluster play/pause video.
     Matches navPrev/navNext circle (r=10, stroke 1.5). Filled glyph for 18px readability on video overlay.
     Source: Bootstrap pause-circle style, adapted to Nucleus convention. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="10" />
  <rect x="8.5" y="7" width="2.5" height="10" rx="1" fill="currentColor" stroke="none" />
  <rect x="13" y="7" width="2.5" height="10" rx="1" fill="currentColor" stroke="none" />
</svg>
