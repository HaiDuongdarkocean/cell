<!-- Nav pause — outline circle + two outline rectangles. Used by navCluster play/pause video.
     Matches navPrev/navNext circle (r=10, stroke 1.5) + outline glyph for visual consistency.
     Source: Adapted from Lucide pause icon, wrapped in circle to match nav cluster pattern. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="12" cy="12" r="10" />
  <rect x="8.5" y="7.5" width="2.5" height="9" rx="1" />
  <rect x="13" y="7.5" width="2.5" height="9" rx="1" />
</svg>
