  <rect x="1.5" y="2" width="21" height="20" rx="2.5" />
  <line x1="5" y1="8" x2="13" y2="8" />
  <line x1="5" y1="12" x2="19" y2="12" />
  <line x1="5" y1="16" x2="16" y2="16" />
</svg>
