<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass — Sun-warmed Pebbles</title>
  <script>
    (function() {
      const saved = localStorage.getItem('liquid-glass-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved ? saved : (prefersDark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="../../../shared/styles/tokens.css" />
  <style>
    :root {
      --concept-primary: #E8A34D;
      --concept-primary-dark: #C68A3E;
      --concept-primary-soft: rgba(232, 163, 77, 0.18);
      --concept-sky: #5EA5E9;
      --concept-leaf: #5FD389;
      --concept-pebble: #A0A0A0;
      --concept-earth: #8B6F4E;
      --concept-sun: #F5B955;
      --concept-water: rgba(255, 253, 248, 0.85);
      --concept-bg: linear-gradient(135deg, #FFF5E6 0%, #FAF2EA 100%);
      --concept-blob: rgba(232, 163, 77, 0.20);
      --concept-text: #3E2E22;
      --concept-text-sec: #7A6A5A;
      --concept-card: rgba(255, 253, 248, 0.86);
      --concept-border: rgba(255, 255, 255, 0.50);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-family), Inter, sans-serif;
      background: var(--concept-bg);
      color: var(--concept-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
      position: relative;
      overflow-x: hidden;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 420px; height: 420px; top: -120px; right: -120px; background: var(--concept-blob); }
    .blob-2 { width: 340px; height: 340px; bottom: -80px; left: -80px; background: var(--concept-sky); opacity: 0.12; }
    .blob-3 { width: 260px; height: 260px; top: 40%; left: 10%; background: var(--concept-sun); opacity: 0.18; }
    .card {
      position: relative;
      z-index: 1;
      width: min(680px, 100%);
      padding: var(--space-7);
      background: var(--concept-card);
      border: 1px solid var(--concept-border);
      border-radius: var(--radius-2xl);
      box-shadow: 0 24px 60px rgba(62, 46, 34, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }
    .eyebrow {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--concept-primary-dark);
    }
    h1 { margin: 0; font-size: var(--font-size-3xl); font-weight: var(--font-weight-semibold); letter-spacing: var(--tracking-tight); }
    .desc { margin: 0; font-size: var(--font-size-base); color: var(--concept-text-sec); line-height: var(--leading-relaxed); }
    .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    .btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1-5);
      padding: var(--space-2-5) var(--space-5);
      border: none;
      border-radius: var(--radius-pill);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
      min-height: var(--touch-target);
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 100%);
      pointer-events: none;
    }
    .btn-primary {
      background: var(--concept-primary);
      color: var(--concept-text);
      box-shadow: 0 4px 16px rgba(232, 163, 77, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232, 163, 77, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
    .btn-primary:active { transform: translateY(0) scale(0.98); background: var(--concept-primary-dark); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.55);
      color: var(--concept-text);
      border: 1px solid rgba(62, 46, 34, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.72); }
    .btn-secondary:active { transform: scale(0.98); }
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: scale(0);
      animation: ripple 0.6s var(--ease-out);
      pointer-events: none;
    }
    @keyframes ripple { to { transform: scale(2.5); opacity: 0; } }
    .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .chip {
      padding: var(--space-1) var(--space-2-5);
      border-radius: var(--radius-pill);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      background: var(--concept-primary-soft);
      color: var(--concept-primary-dark);
      border: 1px solid rgba(232, 163, 77, 0.15);
    }
    .chip.sky { background: rgba(94, 165, 233, 0.12); color: #3B82C4; border-color: rgba(94, 165, 233, 0.16); }
    .chip.leaf { background: rgba(95, 211, 137, 0.12); color: #2E8B57; border-color: rgba(95, 211, 137, 0.16); }
    .chip.pebble { background: rgba(160, 160, 160, 0.12); color: #6E6E73; border-color: rgba(160, 160, 160, 0.16); }
    .chip.earth { background: rgba(139, 111, 78, 0.10); color: #6B4F36; border-color: rgba(139, 111, 78, 0.14); }
    .chip.sun { background: rgba(245, 185, 85, 0.16); color: #9E6A1E; border-color: rgba(245, 185, 85, 0.18); }
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-2); margin-top: var(--space-2); }
    .swatch { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); font-size: var(--font-size-2xs); color: var(--concept-text-sec); }
    .swatch-dot { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.08); }
    .nav { position: absolute; top: var(--space-5); left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: var(--space-2); padding: var(--space-1-5) var(--space-3); background: var(--concept-card); border: 1px solid var(--concept-border); border-radius: var(--radius-pill); backdrop-filter: blur(12px); box-shadow: var(--shadow-floating); }
    .nav a { font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); color: var(--concept-text-sec); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-pill); }
    .nav a:hover { background: var(--concept-primary-soft); color: var(--concept-primary-dark); }
    @media (max-width: 599px) {
      .card { padding: var(--space-5); }
      h1 { font-size: var(--font-size-2xl); }
      .swatches { grid-template-columns: repeat(3, 1fr); }
    }
    html[data-theme="dark"] {
      --concept-bg: linear-gradient(135deg, #2E2218 0%, #3A2A1E 100%);
      --concept-blob: rgba(232, 163, 77, 0.16);
      --concept-text: #FDF9F3;
      --concept-text-sec: #C9B8A8;
      --concept-card: rgba(45, 32, 24, 0.85);
      --concept-border: rgba(255, 255, 255, 0.08);
      --concept-primary: #E8A34D;
      --concept-primary-dark: #C68A3E;
      --concept-primary-soft: rgba(232, 163, 77, 0.20);
      --concept-sky: #6AB2F5;
      --concept-leaf: #5FD389;
      --concept-pebble: #A0A0A0;
      --concept-earth: #C9A87A;
      --concept-sun: #F5C57A;
    }
    html[data-theme="dark"] body { color: var(--concept-text); }
    html[data-theme="dark"] .card { box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
    html[data-theme="dark"] .nav { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25); }
    html[data-theme="dark"] .btn-primary { color: #2E2118; box-shadow: 0 4px 16px rgba(232, 163, 77, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.30); }
    html[data-theme="dark"] .btn-primary:active { background: var(--concept-primary-dark); }
    html[data-theme="dark"] .btn-secondary { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.12); color: var(--concept-text); }
    html[data-theme="dark"] .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); }
    html[data-theme="dark"] .chip { background: rgba(232, 163, 77, 0.14); color: #F5D69A; border-color: rgba(232, 163, 77, 0.22); }
    html[data-theme="dark"] .chip.sky { background: rgba(94, 165, 233, 0.12); color: #A8D1F7; border-color: rgba(94, 165, 233, 0.18); }
    html[data-theme="dark"] .chip.leaf { background: rgba(95, 211, 137, 0.12); color: #8FE9B4; border-color: rgba(95, 211, 137, 0.16); }
    html[data-theme="dark"] .chip.pebble { background: rgba(160, 160, 160, 0.12); color: #C4C4C8; border-color: rgba(160, 160, 160, 0.18); }
    html[data-theme="dark"] .chip.earth { background: rgba(201, 168, 122, 0.12); color: #E2C9A0; border-color: rgba(201, 168, 122, 0.14); }
    html[data-theme="dark"] .nav a { color: var(--concept-text-sec); }
    html[data-theme="dark"] .nav a:hover { background: rgba(232, 163, 77, 0.15); color: var(--concept-primary); }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--concept-border); background: transparent; color: var(--concept-text-sec); cursor: pointer; margin-left: var(--space-2); }
    .theme-toggle:hover { background: var(--concept-primary-soft); }
    html[data-theme="dark"] .theme-toggle .theme-sun { display: none; }
    html[data-theme="light"] .theme-moon { display: none; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="liquid-glass-dawn.html">Dawn</a>
    <a href="liquid-glass-forest.html">Forest</a>
    <a href="liquid-glass-ocean.html">Ocean</a>
    <a href="liquid-glass-warmth.html">Warmth</a>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="theme-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="theme-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <article class="card">
    <div class="eyebrow">Liquid Glass — Concept D · Sun-warmed Pebbles</div>
    <h1>Ấm áp như ánh chiều trên sỏi</h1>
    <p class="desc">Mặt trời vàng rọi xuống mặt nước, sỏi ấm lên, đất nâu hiền hòa. Không gian ấm cúng, chậm rãi và gần gũi.</p>
    <div class="actions">
      <button class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Khám phá
      </button>
      <button class="btn btn-secondary">Tìm hiểu thêm</button>
    </div>
    <div class="chips">
      <span class="chip">Ánh mặt trời</span>
      <span class="chip sky">Bầu trời</span>
      <span class="chip leaf">Lá cây</span>
      <span class="chip pebble">Sỏi</span>
      <span class="chip earth">Đất</span>
    </div>
    <div class="swatches">
      <div class="swatch"><div class="swatch-dot" style="background:#E8A34D;"></div>Sun</div>
      <div class="swatch"><div class="swatch-dot" style="background:#5EA5E9;"></div>Sky</div>
      <div class="swatch"><div class="swatch-dot" style="background:#5FD389;"></div>Leaf</div>
      <div class="swatch"><div class="swatch-dot" style="background:#A0A0A0;"></div>Pebble</div>
      <div class="swatch"><div class="swatch-dot" style="background:#8B6F4E;"></div>Earth</div>
    </div>
  </article>
  <script>
    document.querySelectorAll('.btn-primary, .btn-secondary').forEach(btn => {
      btn.addEventListener('click', e => {
        const rect = btn.getBoundingClientRect();
        const d = Math.max(rect.width, rect.height) * 1.4;
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.width = r.style.height = d + 'px';
        r.style.left = (e.clientX - rect.left - d / 2) + 'px';
        r.style.top = (e.clientY - rect.top - d / 2) + 'px';
        btn.appendChild(r);
        r.addEventListener('animationend', () => r.remove());
      });
    });
  </script>
  <script>
    document.querySelectorAll('.theme-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('liquid-glass-theme', next);
      });
    });
  </script>
</body>
</html>
