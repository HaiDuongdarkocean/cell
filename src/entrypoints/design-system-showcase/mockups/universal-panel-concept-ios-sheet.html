<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cell — Universal Panel Concept A: iOS Bottom Sheet</title>
  <style>
    :root {
      --bg: #EAF2F8;
      --bg-gradient-1: #EAF2F8;
      --bg-gradient-2: #F0F7FF;
      --surface: #FFFFFF;
      --surface-raised: #F7FAFD;
      --border: #D6E3EE;
      --border-subtle: #EAF2F8;
      --text: #1A2B3C;
      --text-secondary: #5A6F82;
      --text-tertiary: #8FA3B8;
      --primary: #2D8AF3;
      --primary-subtle: #E1EEFC;
      --danger: #E26D69;
      --danger-subtle: #FDEDEC;
      --radius-outer: 40px;
      --radius-inner: 28px;
      --radius-pill: 999px;
      --shadow: 0 32px 80px rgba(19, 42, 75, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      background: linear-gradient(160deg, var(--bg-gradient-1), var(--bg-gradient-2));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 24px;
    }

    .meta { text-align: center; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
    .page-title { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }

    .phone {
      width: min(420px, 100%);
      height: 780px;
      background: #111;
      border-radius: 56px;
      padding: 14px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(255,255,255,0.08) inset;
      position: relative;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: #0B1220;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
    }

    .sheet {
      position: relative;
      margin-top: auto;
      height: calc(100% - 56px);
      background: var(--surface);
      border-radius: var(--radius-outer) var(--radius-outer) 0 0;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .drag-handle {
      width: 44px;
      height: 5px;
      border-radius: 3px;
      background: var(--border);
      margin: 12px auto 6px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px 8px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1A3B6C, #2D8AF3);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(45, 138, 243, 0.25);
    }

    .profile-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .profile-sub {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface-raised);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 20px;
    }

    .search {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      padding: 0 20px;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }

    .search::placeholder { color: var(--text-tertiary); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state svg { width: 48px; height: 48px; color: var(--text-tertiary); margin-bottom: 16px; }
    .empty-state h3 { margin: 0 0 8px; font-size: 18px; color: var(--text); }
    .empty-state p { margin: 0; font-size: 15px; line-height: 1.5; }

    .card-creator {
      margin-top: 8px;
      padding: 16px;
      background: var(--surface-raised);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
    }

    .card-creator h4 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      text-align: center;
    }

    .error-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      background: var(--danger-subtle);
      border-left: 4px solid var(--danger);
      border-radius: 14px;
      font-size: 13px;
      color: #7D3C3A;
      margin-bottom: 16px;
    }

    .error-banner svg { width: 20px; height: 20px; color: var(--danger); flex-shrink: 0; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      padding: 0 12px;
      font-size: 14px;
      color: var(--text);
    }

    .tokenize {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
    }

    .tokenize button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 30px;
      padding: 0 12px;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tokenize button.active { background: var(--primary); color: #fff; }

    .more-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;
      padding: 16px 24px;
      background: var(--surface-raised);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 240ms ease, opacity 240ms ease;
      pointer-events: none;
      z-index: 10;
    }

    #more-toggle:checked ~ .more-sheet {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .more-grid {
      display: flex;
      justify-content: space-around;
      gap: 12px;
    }

    .more-grid .action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .more-grid .action .icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--text);
    }

    .tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      border-radius: 16px;
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 600;
      transition: color 160ms ease, background 160ms ease;
      position: relative;
    }

    .tab.active { color: var(--primary); background: var(--primary-subtle); }
    .tab.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 20px;
      height: 3px;
      border-radius: 2px;
      background: var(--primary);
    }

    .tab .icon { width: 22px; height: 22px; }

    .more-trigger { cursor: pointer; }

    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

    .header-left { display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <div class="meta">Concept A — Mobile First</div>
  <h1 class="page-title">iOS Bottom Sheet</h1>

  <div class="phone">
    <div class="screen">
      <div class="backdrop"></div>

      <div class="sheet">
        <div class="drag-handle"></div>

        <header class="header">
          <div class="header-left">
            <div class="profile">
              <div class="profile-avatar">EN</div>
              <div>
                <div class="profile-label">English</div>
                <div class="profile-sub">Target profile</div>
              </div>
            </div>
            <div class="tokenize">
              <button class="active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M4 17v3h3M20 7V4h-3M20 17v3h-3M9 9h6v6H9z"/></svg>
                Text
              </button>
              <button>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="m10 11 5 3-5 3V11Z"/></svg>
                Media
              </button>
            </div>
          </div>
          <div class="title">Universal</div>
          <button class="close" aria-label="Close">×</button>
        </header>

        <main class="content">
          <input type="text" class="search" placeholder="Type a word" />

          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <h3>Ready when you are</h3>
            <p>Search for a word to explore its meaning.</p>
          </div>

          <div class="card-creator">
            <h4>Card Creator</h4>
            <div class="error-banner">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
              <span>Failed to load from AnkiConnect. Check Settings → Card Creator.</span>
            </div>
            <div class="row">
              <div class="field">
                <label>Note type</label>
                <input type="text" placeholder="" />
              </div>
              <div class="field">
                <label>Deck</label>
                <input type="text" placeholder="" />
              </div>
            </div>
            <div class="field">
              <label>Target word</label>
              <input type="text" placeholder="Enter the word or phrase to learn" />
            </div>
          </div>
        </main>

        <input type="checkbox" id="more-toggle" class="visually-hidden">
        <div class="more-sheet">
          <div class="more-grid">
            <div class="action">
              <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></div>
              Reader
            </div>
            <div class="action">
              <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
              SRS
            </div>
            <div class="action">
              <div class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="m10 11 5 3-5 3V11Z"/></svg></div>
              Player
            </div>
          </div>
        </div>

        <nav class="tab-bar">
          <label for="" class="tab active">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
            Dictionary
          </label>
          <label for="" class="tab">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M10 12h10M3 12h.01M3 18h.01M10 18h10M6 3v18"/></svg></span>
            Study
          </label>
          <label for="" class="tab">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            Settings
          </label>
          <label for="more-toggle" class="tab more-trigger">
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></span>
            More
          </label>
        </nav>
      </div>
    </div>
  </div>
</body>
</html>
