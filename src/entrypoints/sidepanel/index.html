<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtitle Panel</title>
    <style>
      /* Reset browser defaults to maximize usable panel area */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      /* Thin scrollbar to reduce whitespace on the right */
      ::-webkit-scrollbar { width: var(--space-1-5); }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--color-scrollbar-thumb); border-radius: var(--radius-xs); }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-thumb-hover); }
      /* Firefox thin scrollbar */
      html { scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
