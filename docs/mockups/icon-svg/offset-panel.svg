<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
  <!-- Offset panel icon: clock + 2 mũi tên ngang đối xứng (dịch thời gian 2 chiều) -->
  <!-- Style: matches rewind/repeat arc (stroke 1.5, round caps) -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- left arrow ← (dịch sớm) -->
  <line x1="11" y1="12" x2="6.5" y2="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8.5 9.5L6 12L8.5 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right arrow → (dịch muộn) -->
  <line x1="13" y1="12" x2="17.5" y2="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15.5 9.5L18 12L15.5 14.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
