<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Offset UI V3 — Mockup</title>
<style>
  :root {
    --color-primary: #2563eb;
    --color-primary-subtle: rgba(37, 99, 235, 0.1);
    --color-background: #ffffff;
    --color-surface: #f8fafc;
    --color-surface-hover: #f1f5f9;
    --color-text: #0f172a;
    --color-text-secondary: #475569;
    --color-text-muted: #94a3b8;
    --color-border: #e2e8f0;
    --color-border-subtle: #f1f5f9;
    --color-success: #10b981;
    --color-info: #2563eb;
    --color-error: #ef4444;
    --color-error-subtle: rgba(239, 68, 68, 0.08);
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-size-xs: 12px;
    --font-size-sm: 13px;
    --font-size-lg: 16px;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-full: 9999px;
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --transition: 150ms ease;
  }
  [data-theme="dark"] {
    --color-primary: #60a5fa;
    --color-primary-subtle: rgba(96, 165, 250, 0.15);
    --color-background: #0f172a;
    --color-surface: #1e293b;
    --color-surface-hover: #334155;
    --color-text: #f1f5f9;
    --color-text-secondary: #cbd5e1;
    --color-text-muted: #64748b;
    --color-border: #334155;
    --color-border-subtle: #1e293b;
    --color-error-subtle: rgba(239, 68, 68, 0.15);
  }
  body {
    font-family: var(--font-family);
    background: var(--color-background);
    color: var(--color-text);
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .panel {
    width: 320px;
    background: var(--color-background);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--spacing-xs);
  }
  .header {
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  .header-label {
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex: 1;
    color: var(--color-text-muted);
  }
  .body {
    padding: var(--spacing-xs) var(--spacing-xs) var(--spacing-sm);
  }

  /* === Input row (TOP) === */
  .input-row {
    display: flex;
    gap: 3px;
    margin-bottom: var(--spacing-sm);
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    background: var(--color-background);
    overflow: hidden;
  }
  .input-wrap:focus-within {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px var(--color-primary-subtle);
  }
  .input {
    flex: 1;
    border: none;
    padding: 8px 14px;
    min-height: 36px;
    background: transparent;
    color: var(--color-text);
    font-family: var(--font-family);
    font-size: var(--font-size-sm);
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .input::placeholder { color: var(--color-text-muted); }
  .input-suffix {
    padding: 0 12px;
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    user-select: none;
  }

  /* === Pill (4 step + value) === */
  .pill {
    display: grid;
    grid-template-columns: 1fr 1fr 1.6fr 1fr 1fr;
    align-items: stretch;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    padding: 3px;
    gap: 0;
    margin-bottom: var(--spacing-sm);
    /* contain focus/hover visuals inside pill so they don't bleed out */
    isolation: isolate;
  }
  .step-btn {
    position: relative;
    z-index: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: var(--font-family);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    font-variant-numeric: tabular-nums;
    padding: 8px 4px;
    min-height: 40px;
    transition: background var(--transition), color var(--transition);
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    /* divider via pseudo-element so it doesn't shift on hover */
  }
  .step-btn + .step-btn::before,
  .step-btn + .value::before,
  .value + .step-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--color-border-subtle);
    pointer-events: none;
  }
  .step-btn.minus { color: var(--color-info); }
  .step-btn.plus { color: var(--color-success); }
  .step-btn:hover { background: var(--color-surface-hover); }
  .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Value cell (center, prominent — editable input) */
  .value {
    position: relative;
    z-index: 2; /* above step buttons so focus bg covers divider */
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-primary-subtle);
    color: var(--color-primary);
    font-family: var(--font-family);
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
    font-variant-numeric: tabular-nums;
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    min-height: 40px;
    min-width: 0;
    width: 100%;
    border: none;
    transition: color var(--transition), background var(--transition), box-shadow var(--transition);
    text-align: center;
    outline: none;
  }
  /* Focus = inset ring (stays inside the cell, no bleed to neighbors) */
  .value:focus {
    box-shadow: inset 0 0 0 2px var(--color-primary);
    background: var(--color-background);
    z-index: 3;
  }
  .value.zero {
    color: var(--color-text-muted);
    background: var(--color-surface-hover);
  }
  .value.positive { color: var(--color-success); }
  .value.negative { color: var(--color-info); }

  /* === Reset button (BOTTOM, full-width) === */
  .reset-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-family);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    transition: background var(--transition), color var(--transition), border-color var(--transition);
  }
  .reset-btn:hover {
    background: var(--color-error-subtle);
    color: var(--color-error);
    border-color: var(--color-error);
  }
  .reset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .reset-icon { display: inline-flex; }

  .hint {
    padding: var(--spacing-sm) 0 0;
    text-align: center;
    color: var(--color-text-muted);
    font-size: var(--font-size-xs);
    display: none;
  }
  .hint.show { display: block; }

  /* Theme toggle (mockup only) */
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 6px 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    background: var(--color-surface);
    color: var(--color-text);
    cursor: pointer;
    font-family: var(--font-family);
    font-size: var(--font-size-xs);
  }
</style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">Toggle theme</button>

  <div class="panel">
    <!-- Header (collapsible) -->
    <div class="header">
      <span class="header-label">OFFSET</span>
    </div>

    <div class="body">
      <!-- Pill: 4 step + value-input (MIDDLE) -->
      <div class="pill" role="group" aria-label="Subtitle offset control">
        <button class="step-btn minus" data-delta="-2000" aria-label="Lùi 2 giây">−2s</button>
        <button class="step-btn minus" data-delta="-500" aria-label="Lùi 0.5 giây">−0.5s</button>
        <input class="value zero" type="text" role="status" aria-label="Current offset (nhập số giây)" value="0s" />
        <button class="step-btn plus" data-delta="500" aria-label="Tiến 0.5 giây">+0.5s</button>
        <button class="step-btn plus" data-delta="2000" aria-label="Tiến 2 giây">+2s</button>
      </div>

      <!-- Reset button (BOTTOM, full-width) -->
      <button class="reset-btn" aria-label="Đặt lại về 0">
        <span class="reset-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <path d="M18.364 8.05026L17.6569 7.34315C14.5327 4.21896 9.46734 4.21896 6.34315 7.34315C3.21895 10.4673 3.21895 15.5327 6.34315 18.6569C9.46734 21.7811 14.5327 21.7811 17.6569 18.6569C19.4737 16.84 20.234 14.3668 19.9377 12.0005M18.364 8.05026H14.1213M18.364 8.05026V3.80762" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Đặt lại về 0</span>
      </button>

      <div class="hint">Cần load subtitle trước</div>
    </div>
  </div>

<script>
  let valueMs = 0;

  const valueEl = document.querySelector('.value');
  const resetBtn = document.querySelector('.reset-btn');
  const stepBtns = document.querySelectorAll('.step-btn');

  function formatValue(ms) {
    if (ms === 0) return '0s';
    const seconds = ms / 1000;
    const sign = ms > 0 ? '+' : '−';
    const abs = Math.abs(seconds);
    const formatted = abs % 1 === 0 ? String(abs) : String(abs);
    return `${sign}${formatted}s`;
  }

  function update() {
    // Only update text when NOT focused (so user can type freely)
    if (document.activeElement !== valueEl) {
      valueEl.value = formatValue(valueMs);
    }
    valueEl.className = 'value';
    if (valueMs === 0) valueEl.classList.add('zero');
    else if (valueMs > 0) valueEl.classList.add('positive');
    else valueEl.classList.add('negative');
  }

  function clamp(ms) {
    const r = Math.round(ms);
    if (r > 60000) return 60000;
    if (r < -60000) return -60000;
    return r;
  }

  function parseInput(str) {
    const t = str.trim();
    if (!t) return null;
    // Accept formats: "0.5", "+0.5", "-0.5", "0.5s", "+0.5s"
    const c = t.endsWith('s') || t.endsWith('S') ? t.slice(0, -1).trim() : t;
    if (!c || c === '+' || c === '-' || c === '−') return null;
    const s = Number(c);
    if (!Number.isFinite(s)) return null;
    const ms = Math.round(s * 1000);
    if (ms < -60000 || ms > 60000) return null;
    return ms;
  }

  stepBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      valueMs = clamp(valueMs + Number(btn.dataset.delta));
      update();
    });
  });

  resetBtn.addEventListener('click', () => {
    valueMs = 0;
    update();
  });

  // Value input: on focus → select all (easy replace). On Enter/blur → parse + commit.
  valueEl.addEventListener('focus', () => {
    valueEl.select();
  });
  valueEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const parsed = parseInput(valueEl.value);
      if (parsed !== null) {
        valueMs = clamp(parsed);
      }
      update();
      valueEl.blur();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      update(); // revert to current valueMs
      valueEl.blur();
    }
  });
  valueEl.addEventListener('blur', () => {
    const parsed = parseInput(valueEl.value);
    if (parsed !== null) {
      valueMs = clamp(parsed);
    }
    update();
  });

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }

  update();
</script>
</body>
</html>
