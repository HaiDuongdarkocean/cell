    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
      body {
        font-family: var(--font-family, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
        font-size: var(--font-size-base, 14px);
        line-height: var(--leading-normal, 1.5);
        color: var(--color-text-primary, #0f172a);
        background: var(--color-background, #ffffff);
      }
      ::-webkit-scrollbar { width: var(--space-1-5); }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--color-scrollbar-thumb); border-radius: var(--radius-xs); }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-thumb-hover); }
      html { scrollbar-width: thin; scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track); }
    </style>
    <script>
      // Minimal chrome.storage mock so settings/theme panels can render outside the extension.
      if (!window.chrome) window.chrome = {};
      if (!window.chrome.storage) {
        const makeArea = () => ({
          get: () => Promise.resolve({}),
          set: () => Promise.resolve(),
          remove: () => Promise.resolve(),
        });
        const listeners = new Set();
        window.chrome.storage = {
          local: makeArea(),
          session: makeArea(),
          onChanged: {
            addListener: (cb) => listeners.add(cb),
            removeListener: (cb) => listeners.delete(cb),
          },
        };
      }
    </script>
