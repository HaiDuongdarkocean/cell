<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider Variant 1 — Value at Right</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1b1b1b;
    --text: #fafafa;
    --border: #FFFFFF1A;
    --muted: #a0a0a0;
    --accent: #3b82f6;
    --track: #FFFFFF1A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 22px 18px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }

  .row {
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }

  /* header line: label group (left) + value (right) */
  .row-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .label-group {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .icon {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #2a2a2a, #383838);
    border: 1px solid var(--border);
  }

  .label-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .label { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .sublabel { font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.2; }

  .value {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding-top: 1px;
  }

  /* slider */
  .slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: pointer;
    display: block;
  }

  /* track */
  .slider::-webkit-slider-runnable-track {
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(to right,
      var(--accent) 0%,
      var(--accent) var(--fill, 50%),
      var(--track) var(--fill, 50%),
      var(--track) 100%);
  }
  .slider::-moz-range-track {
    height: 5px;
    border-radius: 999px;
    background: var(--track);
  }
  .slider::-moz-range-progress {
    height: 5px;
    border-radius: 999px;
    background: var(--accent);
  }

  /* thumb */
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    margin-top: -6.5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 0 0 0 rgba(59,130,246,0);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    transition: transform 0.15s ease;
  }
  .slider:hover::-webkit-slider-thumb {
    transform: scale(1.18);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 6px rgba(59,130,246,0.12);
  }
  .slider:hover::-moz-range-thumb { transform: scale(1.18); }
  .slider:active::-webkit-slider-thumb {
    transform: scale(1.28);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 8px rgba(59,130,246,0.18);
  }
  .slider:focus { outline: none; }
  .slider:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 4px rgba(59,130,246,0.35);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title">Scan Settings</div>

    <div class="row">
      <div class="row-head">
        <div class="label-group">
          <div class="icon"></div>
          <div class="label-text">
            <span class="label">Scan height</span>
            <span class="sublabel">Vertical capture range</span>
          </div>
        </div>
        <span class="value">15%</span>
      </div>
      <input class="slider" type="range" min="0" max="100" value="15" style="--fill: 15%">
    </div>

    <div class="row">
      <div class="row-head">
        <div class="label-group">
          <div class="icon"></div>
          <div class="label-text">
            <span class="label">Scan width</span>
            <span class="sublabel">Horizontal capture range</span>
          </div>
        </div>
        <span class="value">100%</span>
      </div>
      <input class="slider" type="range" min="0" max="100" value="100" style="--fill: 100%">
    </div>

    <div class="row">
      <div class="row-head">
        <div class="label-group">
          <div class="icon"></div>
          <div class="label-text">
            <span class="label">Position X</span>
            <span class="sublabel">Anchor offset from left</span>
          </div>
        </div>
        <span class="value">50%</span>
      </div>
      <input class="slider" type="range" min="0" max="100" value="50" style="--fill: 50%">
    </div>

    <div class="row">
      <div class="row-head">
        <div class="label-group">
          <div class="icon"></div>
          <div class="label-text">
            <span class="label">Position Y</span>
            <span class="sublabel">Anchor offset from top</span>
          </div>
        </div>
        <span class="value">30%</span>
      </div>
      <input class="slider" type="range" min="0" max="100" value="30" style="--fill: 30%">
    </div>
  </div>

  <script>
    // keep fill + value label in sync on drag
    document.querySelectorAll('.slider').forEach(function (s) {
      var valEl = s.closest('.row').querySelector('.value');
      function update() {
        s.style.setProperty('--fill', s.value + '%');
        valEl.textContent = s.value + '%';
      }
      s.addEventListener('input', update);
    });
  </script>
</body>
</html>
