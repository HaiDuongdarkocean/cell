<!DOCTYPE html>
<!--
  Mockup: <feature-name>
  Intent: docs/intent/intent-<feature>.md
  ADR: docs/adr/<NNN>-<decision>.md (if applicable)
  Design system: docs/design-system/design-system.md
  Approved by anh on: <YYYY-MM-DD>
  Mockup revision: v1
  Runtime: <popup | sidepanel | content-script>
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><Feature Name> — Design Mockup v1</title>
<style>
  /* === Design tokens from theme.css (copy-paste, do NOT invent) === */
  :root {
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-primary-subtle: rgba(37, 99, 235, 0.1);
    --color-background: #ffffff;
    --color-surface: #f8fafc;
    --color-surface-hover: #f1f5f9;
    --color-text: #0f172a;
    --color-text-secondary: #475569;
    --color-text-muted: #94a3b8;
    --color-text-inverse: #ffffff;
    --color-border: #e2e8f0;
    --color-border-subtle: #f1f5f9;
    --color-border-focus: #2563eb;
    --color-success: #10b981;
    --color-warning: #f59e0b;
    --color-error: #ef4444;
    --color-info: #2563eb;
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-size-xs: 12px;
    --font-size-sm: 13px;
    --font-size-base: 14px;
    --font-size-lg: 16px;
    --font-weight-regular: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 12px;
    --spacing-lg: 16px;
    --spacing-xl: 24px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-full: 9999px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --transition: 150ms ease;
  }

  [data-theme="dark"] {
    --color-primary: #60a5fa;
    --color-primary-hover: #3b82f6;
    --color-primary-subtle: rgba(96, 165, 250, 0.15);
    --color-background: #0f172a;
    --color-surface: #1e293b;
    --color-surface-hover: #334155;
    --color-text: #f1f5f9;
    --color-text-secondary: #cbd5e1;
    --color-text-muted: #64748b;
    --color-text-inverse: #0f172a;
    --color-border: #334155;
    --color-border-subtle: #1e293b;
    --color-border-focus: #60a5fa;
    --color-success: #10b981;
    --color-warning: #f59e0b;
    --color-error: #ef4444;
    --color-info: #60a5fa;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--color-background); color: var(--color-text);
    font-family: var(--font-family); font-size: var(--font-size-base); line-height: 1.5;
    padding: var(--spacing-xl);
    -webkit-font-smoothing: antialiased;
  }

  /* === Theme toggle (top-right) === */
  .theme-toggle {
    position: fixed; top: var(--spacing-lg); right: var(--spacing-lg);
    padding: var(--spacing-sm) var(--spacing-md);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); cursor: pointer;
    font-size: var(--font-size-sm); color: var(--color-text);
    transition: var(--transition);
  }
  .theme-toggle:hover { background: var(--color-surface-hover); }

  /* === Page header === */
  .page-header { margin-bottom: var(--spacing-xl); }
  .page-header h1 {
    font-size: 20px; font-weight: var(--font-weight-semibold);
    letter-spacing: -0.01em; margin-bottom: var(--spacing-xs);
  }
  .page-header p { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
  .page-header .meta {
    margin-top: var(--spacing-sm); font-size: var(--font-size-xs);
    color: var(--color-text-muted);
  }
  .page-header .meta a { color: var(--color-primary); text-decoration: none; }

  /* === State sections === */
  .state-section { margin-bottom: var(--spacing-xl); }
  .state-section h2 {
    font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold);
    margin-bottom: var(--spacing-md); padding-bottom: var(--spacing-xs);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  .state-section .description {
    font-size: var(--font-size-sm); color: var(--color-text-secondary);
    margin-bottom: var(--spacing-md);
  }

  /* === Component showcase (REPLACE with feature-specific styles) === */
  .component-card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); padding: var(--spacing-lg);
    box-shadow: var(--shadow-sm);
  }

  /* === TODO: Add feature-specific component styles below === */
</style>
</head>
<body data-theme="light">
  <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>

  <div class="page-header">
    <h1><Feature Name> — Mockup v1</h1>
    <p><One-line feature description from intent file></p>
    <div class="meta">
      Intent: <a href="../intent/intent-<feature>.md">intent-<feature>.md</a> ·
      ADR: <a href="../adr/<NNN>-<decision>.md">ADR-<NNN></a> ·
      Runtime: <popup | sidepanel | content-script>
    </div>
  </div>

  <!-- === State: Default === -->
  <section class="state-section">
    <h2>State: Default</h2>
    <p class="description"><Describe when this state appears></p>
    <div class="component-card">
      <!-- TODO: Replace with default state component -->
      <p>Default state content</p>
    </div>
  </section>

  <!-- === State: Loading === -->
  <section class="state-section">
    <h2>State: Loading</h2>
    <p class="description"><Describe when this state appears></p>
    <div class="component-card">
      <!-- TODO: Replace with loading state (skeleton/spinner) -->
      <p>Loading...</p>
    </div>
  </section>

  <!-- === State: Empty === -->
  <section class="state-section">
    <h2>State: Empty</h2>
    <p class="description"><Describe when this state appears></p>
    <div class="component-card">
      <!-- TODO: Replace with empty state message -->
      <p>No items found</p>
    </div>
  </section>

  <!-- === State: Error === -->
  <section class="state-section">
    <h2>State: Error</h2>
    <p class="description"><Describe when this state appears></p>
    <div class="component-card">
      <!-- TODO: Replace with error state -->
      <p>Something went wrong. <a href="#" style="color: var(--color-primary);">Retry</a></p>
    </div>
  </section>

  <!-- === Add more states as needed (collapsed, disabled, active, etc.) === -->

  <script>
    function toggleTheme() {
      const body = document.body;
      const btn = document.querySelector('.theme-toggle');
      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        btn.textContent = '🌙 Dark';
      } else {
        body.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️ Light';
      }
    }
  </script>
</body>
</html>
